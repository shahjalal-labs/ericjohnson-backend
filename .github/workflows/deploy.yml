name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          # key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.ROOT_PASSWORD }}
          debug: true
          script: |
            #!/bin/bash
            set -e

            # Load NVM (if needed for future compatibility)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            #  [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Navigate to project directory
            cd /var/www/ericjohnson-backend

            # Stop the application using PM2
            # pm2 stop ericjohnson-backend

            # Configure git pull.ff to avoid errors (add this line)
            git config pull.ff false

            # Pull the latest changes
            git pull origin main

            # Install dependencies
            npm install

            # Generate Prisma schema
            npx prisma generate

            # Push the database schema changes to the database
            npx prisma db push

            # Build the application
            npm run build

            # Start or restart the application using PM2
            pm2 reload ecosystem.config.js
